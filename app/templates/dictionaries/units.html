{% extends 'base.html' %}{% block content %}<h1 class="h3">Units</h1>
<form method="post" class="row g-2 mb-3"><div class="col-md-3"><input class="form-control" name="code" placeholder="Code" required></div><div class="col-md-5"><input class="form-control" name="name" placeholder="Name" required></div><div class="col-md-2"><input class="form-control" name="parent_id" placeholder="Parent ID"></div><div class="col-md-2"><button class="btn btn-primary w-100">Add</button></div></form>
<table class="table"><tr><th>ID</th><th>Code</th><th>Name</th><th>Parent</th></tr>{% for r in records %}<tr><td>{{r.id}}</td><td>{{r.code}}</td><td>{{r.name}}</td><td>{{r.parent_id}}</td></tr>{% endfor %}</table>{% endblock %}
