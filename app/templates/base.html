<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or 'WriteOff' }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">WriteOff</a>
    {% if current_user %}
    <div class="navbar-nav gap-2">
      <a class="nav-link" href="/events">Events</a>
      <a class="nav-link" href="/dictionaries/units">Units</a>
      <a class="nav-link" href="/dictionaries/services">Services</a>
      <a class="nav-link" href="/dictionaries/nomenclature">Nomenclature</a>
      <a class="nav-link" href="/dictionaries/document-types">Doc types</a>
      {% if current_user.role.code == 'admin' %}<a class="nav-link" href="/users">Users</a>{% endif %}
      <form method="post" action="/logout"><button class="btn btn-sm btn-outline-light">Logout</button></form>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
  {% block content %}{% endblock %}
</main>
</body>
</html>
