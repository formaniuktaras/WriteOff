<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Login</title></head>
<body class="bg-light"><div class="container py-5"><div class="row justify-content-center"><div class="col-md-4">
<div class="card"><div class="card-body"><h1 class="h4 mb-3">Login</h1>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post" action="/login">
  <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required></div>
  <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
  <button class="btn btn-primary w-100" type="submit">Sign in</button>
</form>
</div></div></div></div></div></body></html>
