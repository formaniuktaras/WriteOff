{% extends 'base.html' %}
{% block content %}
<h1 class="h3">Edit event #{{ event.id }}</h1>
<form method="post" action="/events/{{ event.id }}/edit" class="row g-3">
  <div class="col-md-6"><label class="form-label">Title</label><input class="form-control" name="title" value="{{ event.title }}" required></div>
  <div class="col-md-3"><label class="form-label">Date</label><input class="form-control" type="date" name="event_date" value="{{ event.event_date }}" required></div>
  <div class="col-md-3"><label class="form-label">Status</label><select class="form-select" name="status_value">{% for status in event_statuses %}<option value="{{ status.value }}" {% if event.status == status %}selected{% endif %}>{{ status.value }}</option>{% endfor %}</select></div>
  <div class="col-md-6"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ event.location or '' }}"></div>
  <div class="col-12"><label class="form-label">Short description</label><textarea class="form-control" name="short_description">{{ event.short_description or '' }}</textarea></div>
  <div class="col-12"><button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="/events/{{ event.id }}">Cancel</a></div>
</form>
{% endblock %}
