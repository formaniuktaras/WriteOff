{% extends 'base.html' %}
{% block content %}
<h1 class="h3">{{ 'Edit user #' ~ managed_user.id if managed_user else 'Create user' }}</h1>
<form method="post" action="{{ '/users/' ~ managed_user.id ~ '/edit' if managed_user else '/users/new' }}" class="row g-3 mb-4">
  <div class="col-md-4"><label class="form-label">Username</label><input class="form-control" name="username" value="{{ managed_user.username if managed_user else '' }}" required></div>
  <div class="col-md-4"><label class="form-label">Full name</label><input class="form-control" name="full_name" value="{{ managed_user.full_name if managed_user else '' }}"></div>
  <div class="col-md-2"><label class="form-label">Role</label><select class="form-select" name="role_id">{% for role in roles %}<option value="{{ role.id }}" {% if managed_user and managed_user.role_id == role.id %}selected{% endif %}>{{ role.code }}</option>{% endfor %}</select></div>
  <div class="col-md-2 form-check mt-4"><input class="form-check-input" type="checkbox" name="is_active" value="true" {% if not managed_user or managed_user.is_active %}checked{% endif %}> Active</div>
  {% if not managed_user %}
  <div class="col-md-4"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
  {% endif %}
  <div class="col-12"><button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="/users">Cancel</a></div>
</form>
{% if managed_user %}
<h2 class="h5">Change password</h2>
<form method="post" action="/users/{{ managed_user.id }}/password" class="row g-2">
  <div class="col-md-4"><input class="form-control" type="password" name="password" placeholder="New password" required></div>
  <div class="col-md-2"><button class="btn btn-warning">Change</button></div>
</form>
{% endif %}
{% endblock %}
