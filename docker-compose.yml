services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: writeoff
      POSTGRES_USER: writeoff
      POSTGRES_PASSWORD: writeoff
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writeoff -d writeoff"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: writeoff
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/data/storage
      - backups_data:/data/backups
    command: ["sh", "docker/web-entrypoint.sh"]

  nginx:
    image: nginx:1.27
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/app/app/static:ro

volumes:
  postgres_data:
  storage_data:
  backups_data:
