services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: writeoff
      POSTGRES_USER: writeoff
      POSTGRES_PASSWORD: writeoff
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - storage_data:/data/storage
      - backups_data:/data/backups
    command: sh -c "alembic upgrade head && python scripts/init_storage.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  nginx:
    image: nginx:1.27
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/app/app/static:ro

volumes:
  postgres_data:
  storage_data:
  backups_data:
